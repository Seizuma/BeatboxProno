services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Boucle locale uniquement : pour psql, les sauvegardes et prisma migrate.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Les photos de beatboxers vivent dans l'autre projet du VPS. On les monte
      # en lecture seule : ce conteneur ne doit jamais pouvoir les modifier.
      - ${ARTIST_PHOTOS_HOST_DIR}:/media/artists:ro
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      BOOTSTRAP_ADMIN_DISCORD_IDS: ${BOOTSTRAP_ADMIN_DISCORD_IDS}
      ARTIST_PHOTOS_DIR: /media/artists

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Nginx Proxy Manager tape ici. Rien d'autre n'est exposé sur le VPS.
      - "127.0.0.1:8080:80"

volumes:
  db-data:
